services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    # Watchtower (autoupdate profile) only touches containers with this label.
    labels:
      - "com.centurylinkfoundation.watchtower.enable=true"
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD}@db:5432/hub
      DATA_DIR: /app/data
      NPM_CONFIG_CACHE: /root/.npm
    volumes:
      - app-data:/app/data
      - npx-cache:/root/.npm
      # Optional: drop *.json connector manifests here to add your own
      # marketplace entries (created on the host, bind-mounted read-only).
      - ${CUSTOM_CONNECTORS_DIR:-./connectors}:/app/data/connectors:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional fully-automatic updates: pulls a newer xeniak123/mcp-hub image
  # when one is published and recreates the app container. Off by default —
  # enable with: docker compose --profile autoupdate up -d
  watchtower:
    image: containrrr/watchtower
    profiles: ["autoupdate"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: --interval 3600 --cleanup --label-enable mcp-hub

volumes:
  pgdata:
  npx-cache:
  app-data:
