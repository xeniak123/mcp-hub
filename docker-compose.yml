services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD}@db:5432/hub
      DATA_DIR: /app/data
      NPM_CONFIG_CACHE: /root/.npm
    volumes:
      - app-data:/app/data
      - npx-cache:/root/.npm
      # Optional: drop *.json connector manifests here to add your own
      # marketplace entries (created on the host, bind-mounted read-only).
      - ${CUSTOM_CONNECTORS_DIR:-./connectors}:/app/data/connectors:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  npx-cache:
  app-data:
